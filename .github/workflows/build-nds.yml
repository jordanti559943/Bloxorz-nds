name: Build Nintendo DS ROM

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install DevKit
      run: |
        sudo apt-get update
        sudo apt-get install -y devkitpro-pacman
        sudo dkp-pacman -Syu --noconfirm
        sudo dkp-pacman -S --noconfirm devkitARM libnds libfat-dev
    
    - name: Build ROM
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        make
    
    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: bloxorz-rom
        path: "*.nds"
